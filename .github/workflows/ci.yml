name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Минимальные права: CI ничего не пишет в репозиторий.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Проект Windows-first: os.replace, NamedTemporaryFile, русские пути и
        # кодировка консоли проверены только на Windows.
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    # Зависший тест не должен держать job шесть часов.
    timeout-minutes: 15
    steps:
      # Действия закреплены на SHA: тег v4 можно переписать в любой момент, а
      # SHA нельзя. Версия написана рядом с SHA — по ней понятно, что обновлять.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Установка Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Линтер (ruff)
        run: ruff check .

      - name: Типы (mypy)
        run: mypy

      - name: Тесты (pytest)
        run: pytest -q

  package:
    # Упаковка проверяется отдельно от тестов: wheel, который нельзя поставить,
    # проходит тесты в дереве и ломается у пользователя.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Установка Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Сборка пакета
        run: python -m build

      - name: Описание пакета читается
        run: twine check dist/*

      - name: В wheel есть код приложения
        # Темы и иконки лежат в resources/ рядом с пакетом, а не внутри него,
        # поэтому в wheel их нет: установка из wheel не поддерживается, о чём
        # написано в docs/known-issues.md. Проверяем то, что гарантировано, —
        # сам код и его метаданные.
        run: |
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob("dist/*.whl")
          assert wheels, "сборка не дала wheel"
          names = zipfile.ZipFile(wheels[0]).namelist()
          for expected in ("app/__init__.py", "app/core/models.py", "app/providers/polza.py"):
              assert expected in names, f"в wheel нет {expected}"
          print(f"в wheel {len(names)} файлов, код на месте")
          PY

  tests-without-qt:
    # Наш guard `test_no_test_module_imports_qt` существует из-за того, что
    # headless-раннер не может импортировать Qt. Пока Qt стоит в зависимостях,
    # ограничение держится на честности контрибьютора, поэтому оно проверяется
    # отдельным прогоном без PySide6.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Установка Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей без Qt
        run: |
          python -m pip install --upgrade pip
          pip install requests markdown-it-py Pygments pytest

      - name: PySide6 не должен попасть в тесты
        run: |
          python -c "import PySide6" 2>/dev/null && (echo "PySide6 установлен, проверка бессмысленна" && exit 1) || echo "PySide6 отсутствует, как и нужно"

      - name: Линтер (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Тесты без Qt (pytest)
        run: pytest -q

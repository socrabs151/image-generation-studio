[project]
name = "image-generation-studio"
version = "0.1.0"
description = "Desktop app for image generation via aggregators (AITUNNEL, Polza.ai)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "socrabs151" }]
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Линтер и форматтер
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["references", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

# ---------------------------------------------------------------------------
# Тесты
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
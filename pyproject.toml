[project]
name = "image-generation-studio"
# The version is not written here: it lives in app/__init__.py and is read from
# there, so a release is one edit. A second copy here is a copy that drifts.
dynamic = ["version"]
description = "Desktop app for image generation via aggregators (AITUNNEL, Polza.ai)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "socrabs151" }]
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "markdown-it-py>=3.0",
    "Pygments>=2.17",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    # Checked with the 2.x line; the lower bound keeps CI on the generation the
    # code was cleaned against, so a new major does not turn the build red.
    "mypy>=2.0",
    # Type information for the two libraries that ship none.
    "types-requests>=2.32",
    "types-Pygments>=2.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Линтер и форматтер
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["references", ".venv", "build", "dist"]

[tool.ruff.lint]
# BLE is on so that `# noqa: BLE001` markers are enforced rather than decorative:
# a broad catch has to say out loud why it is broad.
select = ["E", "F", "I", "W", "UP", "B", "BLE"]

# ---------------------------------------------------------------------------
# Проверка типов
# ---------------------------------------------------------------------------
[tool.mypy]
files = ["app"]
python_version = "3.11"
# The code is annotated everywhere, so the check is strict about keeping it that
# way: a function that loses its annotations would otherwise pass quietly.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
# A `type: ignore` that no longer suppresses anything is a leftover from a fixed
# bug, and it would hide the next one.
warn_unused_ignores = true
strict_equality = true
# Only `app` is checked. The tests deliberately feed malformed data to the
# stores to see how they survive it, which these settings would report as false
# alarms.
exclude = ["^references/", "^build/", "^dist/"]

# ---------------------------------------------------------------------------
# Тесты
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"